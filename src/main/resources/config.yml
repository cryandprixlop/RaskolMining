# ===== RaskolMining =====
# Все шансы указаны в процентах (0-100).
regen:
  interval-hours: 3

pick:
  craft-success-chance: 25.0

license:
  default-price: 500.0
  duration-days: 30
  gold:
    default-price: 6500.0
    duration-days: 7

town-account-prefix: "town-"

# Руда приоритетнее защиты Towny (при действующей лицензии)
ores-override-towny: true

# Защита диких земель: ломать можно только руду (+ allowed-extra)
wilderness-protect:
  enabled: true
  allowed-extra: []

ores:
  - COAL_ORE
  - DEEPSLATE_COAL_ORE
  - IRON_ORE
  - DEEPSLATE_IRON_ORE
  - COPPER_ORE
  - DEEPSLATE_COPPER_ORE
  - GOLD_ORE
  - DEEPSLATE_GOLD_ORE
  - REDSTONE_ORE
  - DEEPSLATE_REDSTONE_ORE
  - LAPIS_ORE
  - DEEPSLATE_LAPIS_ORE
  - DIAMOND_ORE
  - DEEPSLATE_DIAMOND_ORE
  - EMERALD_ORE
  - DEEPSLATE_EMERALD_ORE
  - NETHER_GOLD_ORE
  - NETHER_QUARTZ_ORE

# Золотые руды (подмножество ores): нужна лицензия GOLD
gold-ores:
  - GOLD_ORE
  - DEEPSLATE_GOLD_ORE
  - NETHER_GOLD_ORE

loot:
  vanilla:
    golden-chance: 0.001
    next-fragment-chance: 5.0
    double-chance: 2.0
  veteran:
    golden-chance: 0.002
    next-fragment-chance: 4.0
    double-chance: 4.0
  dwarf:
    golden-chance: 0.01
    next-fragment-chance: 4.0
    double-chance: 20.0
  goblin:
    golden-chance: 0.5
    double-chance: 30.0
    triple-chance: 12.0
    quad-chance: 8.0
